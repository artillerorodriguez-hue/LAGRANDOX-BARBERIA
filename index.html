<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Gran Dox · Reservas</title>
<meta name="description" content="Agenda, reservas, caja y fila para barberías. Gratis.">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Gran Dox">
<link rel="icon" id="fav" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b;--panel:#141414;--panel2:#1c1c1c;--line:#272727;--text:#f3efe7;--muted:#8f8a80;
  --accent:#f3efe7;--accent2:#d8c49c;--ink:#0b0b0b;--red:#d06a5f;--green:#7fb08a;--blue:#8fa9d6;--amber:#d9a85b;
  --r:18px;--disp:'Jost',system-ui,sans-serif;--body:'Jost',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
a{color:var(--accent2)}
h1,h2,h3{font-family:var(--disp);font-weight:500;letter-spacing:.08em;margin:0;line-height:1.1;text-transform:uppercase}
h1{font-size:30px;font-weight:400;letter-spacing:.12em}h2{font-size:17px;margin-bottom:8px;letter-spacing:.14em}h3{font-size:15px;letter-spacing:.12em}
p{margin:.3em 0}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}
.stripe{height:1px;background:linear-gradient(90deg,transparent,rgba(243,239,231,.55) 50%,transparent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:600 14px var(--body);padding:11px 20px;border-radius:999px;cursor:pointer;letter-spacing:.02em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#5a554b}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.primary:hover{background:#fff;box-shadow:0 6px 24px rgba(243,239,231,.18)}
.btn.ghost{background:transparent}
.btn.ok{background:rgba(95,174,114,.15);border-color:rgba(95,174,114,.45);color:#9bd8aa}
.btn.danger-ghost{background:transparent;border-color:rgba(208,73,62,.4);color:#f09a92}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:999px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);font:500 15px var(--body);padding:11px 12px;border-radius:12px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--text);font-weight:500}
label.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card+.card{margin-top:16px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip.blue{background:rgba(107,155,224,.15);color:#a9c6f0}.chip.green{background:rgba(95,174,114,.15);color:#9bd8aa}
.chip.red{background:rgba(208,73,62,.15);color:#f09a92}.chip.amber{background:rgba(224,162,58,.15);color:#f0c57a}
.chip.gold{background:rgba(216,196,156,.13);color:var(--accent2)}.chip.gray{background:var(--panel2);color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
.badge.demo{color:#f0c57a;border-color:rgba(224,162,58,.4)}.badge.firebase{color:#9bd8aa;border-color:rgba(95,174,114,.4)}
.nbadge{background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px;margin-left:auto}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
/* layout */
.top{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(11,11,11,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--disp);font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.28em;white-space:nowrap}
.logo{width:34px;height:34px;display:inline-grid;place-items:center;color:var(--text)}
.logo svg{width:34px;height:34px}
.logo-full{color:var(--text);display:block}
.logo-full svg{width:100%;height:auto;display:block}
.shoplogo{display:block;margin:0 auto;max-width:150px;max-height:150px;object-fit:contain}
.shop-pick{flex:1;min-width:0}
.shop-pick strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.shop-pick select{max-width:260px;padding:7px 10px}
.top-right{display:flex;gap:8px;align-items:center}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side a,.bottom a{display:flex;align-items:center;gap:12px;color:var(--muted);text-decoration:none;padding:11px 12px;border-radius:10px;font-weight:600}
.side a:hover{background:var(--panel2);color:var(--text)}
.side a.on{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--text)}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:28px;max-width:1280px;width:100%;min-width:0}
.bottom{display:none}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.datebar input,.datebar select{width:auto;padding:7px 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--disp);font-size:30px;font-weight:300;line-height:1.1;color:var(--text)}
.stat b.m{font-size:24px;font-weight:400}
.stat span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.col h3{display:flex;justify-content:space-between;align-items:center}
.count{font-family:var(--body);font-size:12px;background:var(--panel2);border-radius:99px;padding:2px 9px;color:var(--muted)}
.appt{display:flex;gap:12px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:12px}
.appt.st-completada{border-left-color:var(--green)}.appt.st-cancelada{border-left-color:var(--red);opacity:.55}.appt.st-no_asistio{border-left-color:var(--amber)}
.appt.block{border-left-color:#6b6356;background:repeating-linear-gradient(-45deg,var(--panel2) 0 8px,#1f1d1a 8px 16px)}
.appt-time{display:flex;flex-direction:column;align-items:center;min-width:46px}
.appt-time b{font-family:var(--disp);font-size:19px;font-weight:500}.appt-time small{color:var(--muted);font-size:12px}
.appt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.appt-top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.appt-top strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appt-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{font-size:13px;background:rgba(216,196,156,.08);border-radius:8px;padding:5px 9px;color:#e6dac2}
.note.client{background:rgba(107,155,224,.08);color:#c9d8f0}
.setup{background:linear-gradient(135deg,rgba(243,239,231,.07),rgba(243,239,231,.01));border:1px solid rgba(243,239,231,.2);border-radius:var(--r);padding:18px;margin-bottom:18px}
.setup ol{margin:8px 0 0;padding-left:20px}.setup li{margin:4px 0}
.panel-mini{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.panel-mini summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.panel-mini summary::-webkit-details-marker{display:none}
.mini-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;flex-wrap:wrap}
.item.off{opacity:.55}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{flex-direction:row;align-items:center;gap:0}
.days input{display:none}
.days span{padding:7px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.days input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.hours{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:110px 90px 1fr 1fr;gap:8px;align-items:center}
.hrow input[type=time]{padding:8px}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.linkbox input{flex:1;min-width:220px}
.qr{background:#fff;display:inline-block;padding:12px;border-radius:10px;margin:6px 12px 6px 0;vertical-align:middle}
.qr:empty{display:none}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:16px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--muted);font:500 13px var(--body);padding:8px 16px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--text);color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:140px 1fr 120px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .v{text-align:right;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;border-bottom:0}
.gal-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.gal-admin div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.gal-admin img{width:100%;height:100%;object-fit:cover}
.gal-admin button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);border:0;color:#fff;border-radius:99px;width:26px;height:26px;cursor:pointer;font-weight:800}
/* checkout */
.ck-line{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck-line .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}
.ck-add{display:grid;grid-template-columns:1fr 70px auto;gap:8px}
.tot{display:flex;flex-direction:column;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-family:var(--disp);font-size:26px;font-weight:400;color:var(--accent2);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.reward{background:rgba(95,174,114,.1);border:1px solid rgba(95,174,114,.35);border-radius:10px;padding:10px 12px}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:22px;width:100%;max-width:540px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
.field-label{font-size:13px;font-weight:600;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{background:var(--bg);border:1px solid var(--line);color:var(--text);font:500 15px var(--body);padding:11px 6px;border-radius:999px;cursor:pointer;transition:.15s}
.slot:hover{border-color:rgba(243,239,231,.6)}
.slot.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:#f2ece1;color:#141210;font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:.3s;font-size:14px;max-width:90vw}
.toast.err{background:#f09a92}.toast.out{opacity:0;transform:translateY(8px)}
@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{min-height:60vh;display:grid;place-items:center}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
/* auth & onboarding */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:calc(100vh - 5px)}
.hero{padding:56px;display:flex;flex-direction:column;justify-content:center;gap:22px;background:radial-gradient(ellipse at 30% 20%,rgba(243,239,231,.08),transparent 55%),var(--bg);border-right:1px solid var(--line)}
.hero .logo-full{width:min(300px,70%);margin-bottom:10px}
.hero h1{font-size:clamp(30px,3.6vw,50px);line-height:1.1;font-weight:300;letter-spacing:.1em}
.hero h1 em{font-style:normal;font-weight:500;color:var(--accent2)}
.hero ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:10px;color:#d9d0c0}
.hero li::before{content:"";display:inline-block;width:18px;height:1px;background:var(--accent2);margin-right:14px;vertical-align:middle}
.auth-side{display:grid;place-items:center;padding:32px 20px}
.auth-card{width:100%;max-width:400px}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font:500 14px var(--body);letter-spacing:.04em;padding:10px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--ink)}
.notice{font-size:13px;border:1px solid rgba(216,196,156,.3);background:rgba(216,196,156,.06);color:#e6dac2;padding:12px;border-radius:10px;margin-top:16px}
.center-wrap{display:grid;place-items:center;padding:40px 16px;min-height:calc(100vh - 5px)}
.narrow{max-width:520px;width:100%}
.prefix{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.prefix span{padding:11px 0 11px 12px;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%;align-self:center}
.prefix input{border:0;border-radius:0;padding-left:2px}
/* public */
.pub{max-width:720px;margin:0 auto;padding:24px 16px 60px}
body.pubmode{background:radial-gradient(ellipse 90% 420px at 50% 0%,rgba(243,239,231,.09),transparent 70%) var(--bg) no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.logo-prev{width:160px;min-height:80px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--text)}
.logo-prev img{max-width:100%;max-height:120px}
.pubwrap{background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(243,239,231,.09),transparent 70%),var(--bg);min-height:100vh}
.pub-head{padding:34px 0 26px;text-align:center}
.pub-head .logo-full{width:min(230px,62vw);margin:0 auto 18px}
.pub-head .mark{width:92px;margin:0 auto 18px;color:var(--text)}
.pub-head .mark svg{width:100%;height:auto}
.pub-head h1{font-size:clamp(24px,6vw,36px);font-weight:400;letter-spacing:.2em}
.pub-head .sub{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.pub-meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:13px;margin-top:16px}
.pub-meta>*{border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none}
.pub-meta a{color:var(--muted)}
.rating{color:var(--accent2);font-weight:700}
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps i{flex:1;height:2px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(180deg,#171717,#121212);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--text);cursor:pointer;font:inherit;margin-bottom:10px;transition:.15s}
.opt:hover{border-color:rgba(243,239,231,.55);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.opt strong{font-size:16px;font-weight:500;display:block;letter-spacing:.02em}
.opt .price{font-family:var(--disp);font-size:19px;font-weight:400;color:var(--accent2);white-space:nowrap}
label.opt{flex-direction:row;font-weight:500;color:var(--text);font-size:15px}
label.opt input{width:20px;height:20px;accent-color:var(--accent)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--ink);flex:none}
.datestrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:thin}
.dchip{flex:none;width:64px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer;color:var(--text);font:inherit}
.dchip small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:700}
.dchip b{font-family:var(--disp);font-size:22px;font-weight:400;display:block}
.dchip.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}.dchip.on small{color:var(--ink)}
.dchip:disabled{opacity:.3;cursor:default}
.group-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
.summary{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.summary div{display:flex;justify-content:space-between;gap:10px}
.summary span{color:var(--muted)}
.summary b{text-align:right}
.back{background:none;border:0;color:var(--muted);font:600 14px var(--body);cursor:pointer;padding:0;margin-bottom:14px}
.success{text-align:center;padding:10px 0}
.success .tick{width:70px;height:70px;border-radius:50%;background:rgba(95,174,114,.15);display:grid;place-items:center;margin:0 auto 14px}
.success .tick svg{width:36px;height:36px;stroke:#9bd8aa;fill:none;stroke-width:3}
.payinfo{white-space:pre-wrap;background:rgba(216,196,156,.07);border:1px solid rgba(216,196,156,.28);border-radius:10px;padding:12px;font-size:14px;text-align:left}
.pub footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
.pub-section{margin-top:26px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:150;display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:90vh;border-radius:10px}
.review{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.stars{color:var(--accent2);letter-spacing:2px}
.starpick{display:flex;gap:6px;justify-content:center;margin:10px 0}
.starpick button{background:none;border:0;font-size:40px;color:var(--line);cursor:pointer;padding:0;line-height:1}
.starpick button.on{color:var(--accent2)}
.ticket{font-family:var(--disp);font-size:96px;font-weight:300;line-height:1;color:var(--accent2)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.qrow.me{border-color:var(--accent)}
.qnum{font-family:var(--disp);font-size:24px;font-weight:400;color:var(--accent2);min-width:44px}
/* TV */
.tv{min-height:100vh;padding:34px 44px;display:grid;grid-template-columns:1.3fr 1fr;gap:34px}
.tv h1{font-size:44px;font-weight:300;letter-spacing:.2em}
.tv .logo-full{width:220px;margin-bottom:10px}.tv h2{font-size:34px;color:var(--muted);margin:18px 0 12px}
.tv .qrow{font-size:28px;padding:16px 20px}.tv .qnum{font-size:44px;min-width:80px}
.tv .clock{font-family:var(--disp);font-size:54px;font-weight:300;color:var(--accent2)}
.tv .now .qrow{border-color:var(--green);background:rgba(95,174,114,.1)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 14px 110px}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}
  .bottom::-webkit-scrollbar{display:none}
  .bottom a{flex-direction:column;gap:3px;padding:6px 4px;font-size:10.5px;flex:1 0 64px;text-align:center;border-radius:8px;position:relative}
  .bottom a .nbadge{position:absolute;top:0;right:8px}
  .bottom a.on{color:var(--accent2)}
  .top{padding:10px 14px;gap:10px}
  .brand span:last-child{display:none}
  .top-right .hide-m{display:none}
  .auth{grid-template-columns:1fr}
  .hero{padding:36px 22px;border-right:0;border-bottom:1px solid var(--line)}
  .two{grid-template-columns:1fr}
  .hrow{grid-template-columns:90px 80px 1fr 1fr}
  h1{font-size:28px}
  .bar{grid-template-columns:100px 1fr 100px}
  .tv{grid-template-columns:1fr;padding:20px}
}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}.hrow{grid-template-columns:1fr 1fr}.hrow .hday{grid-column:1/-1}.ck-add{grid-template-columns:1fr 60px}.ck-add .btn{grid-column:1/-1}}

function beep() {
  try { const C = window.AudioContext || window.webkitAudioContext; const c = new C(); const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(.15, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .5); o.start(); o.stop(c.currentTime + .5); } catch {}
}

  const url = URL.createObjectURL(new Blob([content], { type }));
  const l = document.createElement('a'); l.href = url; l.download = name; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function compressImage(file, max = 900, q = .72, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL(type, q)); };
    img.onerror = rej; img.src = url;
  });
}

let DB;

async function firebaseAdapter(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
  const [appM, authM, fs] = await Promise.all([
    import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)
  ]);
  const app = appM.initializeApp(cfg);
  const auth = authM.getAuth(app);
  let db;
  try { db = fs.initializeFirestore(app, { ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true, localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }, FIRESTORE_DB); }
  catch (e) { console.warn(e); try { db = fs.initializeFirestore(app, { ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true }, FIRESTORE_DB); } catch { db = fs.getFirestore(app, FIRESTORE_DB); } }
  const { doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, writeBatch, onSnapshot, query, where } = fs;
  const col = (s, sub) => collection(db, 'shops', s, sub);
  const arr = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const onErr = e => { console.error(e); toast('Error de sincronización: ' + errMsg(e), 'err'); };
  const conv = o => { const r = {}; for (const [k, v] of Object.entries(o || {})) { if (v === undefined) continue; r[k] = (v && typeof v === 'object' && '__inc' in v) ? fs.increment(v.__inc) : v; } return r; };
  const range = (id, sub, f, a, b) => query(col(id, sub), where(f, '>=', a), where(f, '<=', b));
  const eq = (id, sub, f, v) => query(col(id, sub), where(f, '==', v));
  return {
    mode: 'firebase',
    onAuth: cb => authM.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: (u.email || '').toLowerCase() } : null)),
    signUp: (e, p) => authM.createUserWithEmailAndPassword(auth, e, p),
    signIn: (e, p) => authM.signInWithEmailAndPassword(auth, e, p),
    signOut: () => authM.signOut(auth),
    reset: e => authM.sendPasswordResetEmail(auth, e),
    async getSlug(slug) { const s = await getDoc(doc(db, 'slugs', slug)); return s.exists() ? s.data().shopId : null; },
    async getShop(id) { const s = await getDoc(doc(db, 'shops', id)); return s.exists() ? { id: s.id, ...s.data() } : null; },
    watchShop: (id, cb) => onSnapshot(doc(db, 'shops', id), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), onErr),
    async createShop(shop, slug, user) {
      const ref = doc(collection(db, 'shops'));
      const b = writeBatch(db);
      b.set(ref, { ...shop, slug, ownerUid: user.uid, createdAt: Date.now() });
      b.set(doc(db, 'slugs', slug), { shopId: ref.id });
      b.set(doc(db, 'shops', ref.id, 'members', user.email), { email: user.email, role: 'owner', barberId: '', addedAt: Date.now() });
      b.set(doc(db, 'userShops', user.email, 'shops', ref.id), { shopId: ref.id, shopName: shop.name, role: 'owner', barberId: '' });
      await b.commit();
      return ref.id;
    },
    updateShop: (id, data) => updateDoc(doc(db, 'shops', id), conv(data)),
    async myShops(email) { return arr(await getDocs(collection(db, 'userShops', email, 'shops'))); },
    async listMembers(id) { return arr(await getDocs(col(id, 'members'))); },
    async addMember(id, email, role, shopName, barberId = '') {
      const b = writeBatch(db);
      b.set(doc(db, 'shops', id, 'members', email), { email, role, barberId, addedAt: Date.now() });
      b.set(doc(db, 'userShops', email, 'shops', id), { shopId: id, shopName, role, barberId });
      await b.commit();
    },
    async removeMember(id, email) {
      const b = writeBatch(db);
      b.delete(doc(db, 'shops', id, 'members', email));
      b.delete(doc(db, 'userShops', email, 'shops', id));
      await b.commit();
    },
    newId: (id, sub) => doc(col(id, sub)).id,
    async getOne(id, sub, docId) { const s = await getDoc(doc(db, 'shops', id, sub, docId)); return s.exists() ? { id: s.id, ...s.data() } : null; },
    watch: (id, sub, cb) => onSnapshot(col(id, sub), s => cb(arr(s)), onErr),
    async list(id, sub) { return arr(await getDocs(col(id, sub))); },
    async save(id, sub, docId, data) {
      if (docId) { await setDoc(doc(db, 'shops', id, sub, docId), conv(data), { merge: true }); return docId; }
      const r = doc(col(id, sub)); await setDoc(r, conv(data)); return r.id;
    },
    upd: (id, sub, docId, data) => updateDoc(doc(db, 'shops', id, sub, docId), conv(data)),
    del: (id, sub, docId) => deleteDoc(doc(db, 'shops', id, sub, docId)),
    async run(id, ops) {
      const b = writeBatch(db);
      for (const o of ops) {
        const r = doc(db, 'shops', id, o.sub, o.id);
        if (o.t === 'set') b.set(r, conv(o.data), o.merge ? { merge: true } : {});
        else if (o.t === 'update') b.update(r, conv(o.data));
        else if (o.t === 'del') b.delete(r);
      }
      await b.commit();
    },
    watchRange: (id, sub, f, a, b, cb) => onSnapshot(range(id, sub, f, a, b), s => cb(arr(s)), onErr),
    async listRange(id, sub, f, a, b) { return arr(await getDocs(range(id, sub, f, a, b))); },
    watchEq: (id, sub, f, v, cb) => onSnapshot(eq(id, sub, f, v), s => cb(arr(s)), onErr),
    async listEq(id, sub, f, v) { return arr(await getDocs(eq(id, sub, f, v))); },
    async locksFor(id, date) { const s = await getDocs(eq(id, 'locks', 'date', date)); return s.docs.map(d => d.id); },
    async book(id, appt, locks) {
      const ref = doc(col(id, 'appointments'));
      const b = writeBatch(db);
      b.set(ref, conv(appt));
      locks.forEach(l => b.set(doc(db, 'shops', id, 'locks', l), { date: appt.date, barberId: appt.barberId, apptId: ref.id }));
      try { await b.commit(); }
      catch (e) { if (e.code === 'permission-denied' || e.code === 'already-exists') throw new Error('SLOT_TAKEN'); throw e; }
      return ref.id;
    }
  };
}

  const commit = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Almacenamiento del navegador lleno (modo demo).', 'err'); } notifyL(); };
  const cur = () => S.session && S.users[S.session] ? { uid: S.users[S.session].uid, email: S.session } : null;
  const fireAuth = () => { const u = cur(); authCbs.forEach(cb => cb(u)); };
  window.addEventListener('storage', e => { if (e.key !== KEY) return; const prev = S.session; S = load(); notifyL(); if (prev !== S.session) fireAuth(); });
  const nid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const get = p => S.docs[p] ? { id: p.split('/').pop(), ...S.docs[p] } : null;
  const kids = pre => Object.keys(S.docs).filter(p => p.startsWith(pre + '/') && !p.slice(pre.length + 1).includes('/')).map(get);
  const E = code => { const e = new Error(code); e.code = code; return e; };
  const live = fn => { L.add(fn); fn(); return () => L.delete(fn); };
  const sp = id => 'shops/' + id;
  const apply = (p, data, merge) => {
    const old = S.docs[p] || {}; const n = merge ? { ...old } : {};
    for (const [k, v] of Object.entries(data || {})) { if (v === undefined) continue; n[k] = (v && typeof v === 'object' && '__inc' in v) ? (+old[k] || 0) + v.__inc : v; }
    S.docs[p] = n;
  };
  return {
    mode: 'demo',
    onAuth(cb) { authCbs.push(cb); setTimeout(() => cb(cur()), 0); return () => { authCbs = authCbs.filter(x => x !== cb); }; },
    async signUp(e, p) {
      if (!/^\S+@\S+\.\S+$/.test(e)) throw E('auth/invalid-email');
      if (S.users[e]) throw E('auth/email-already-in-use');
      if (p.length < 6) throw E('auth/weak-password');
      S.users[e] = { pw: p, uid: nid() }; S.session = e; commit(); fireAuth();
    },
    async signIn(e, p) { if (!S.users[e] || S.users[e].pw !== p) throw E('auth/invalid-credential'); S.session = e; commit(); fireAuth(); },
    async signOut() { S.session = null; commit(); fireAuth(); },
    async reset() { throw E('demo/no-reset'); },
    async getSlug(slug) { return S.docs['slugs/' + slug]?.shopId || null; },
    async getShop(id) { return get(sp(id)); },
    watchShop(id, cb) { return live(() => cb(get(sp(id)))); },
    async createShop(shop, slug, user) {
      if (S.docs['slugs/' + slug]) throw E('slug-taken');
      const id = nid();
      S.docs[sp(id)] = { ...shop, slug, ownerUid: user.uid, createdAt: Date.now() };
      S.docs['slugs/' + slug] = { shopId: id };
      S.docs[`${sp(id)}/members/${user.email}`] = { email: user.email, role: 'owner', barberId: '', addedAt: Date.now() };
      S.docs[`userShops/${user.email}/shops/${id}`] = { shopId: id, shopName: shop.name, role: 'owner', barberId: '' };
      commit(); return id;
    },
    async updateShop(id, data) { apply(sp(id), data, true); commit(); },
    async myShops(email) { return kids(`userShops/${email}/shops`); },
    async listMembers(id) { return kids(`${sp(id)}/members`); },
    async addMember(id, email, role, shopName, barberId = '') {
      S.docs[`${sp(id)}/members/${email}`] = { email, role, barberId, addedAt: Date.now() };
      S.docs[`userShops/${email}/shops/${id}`] = { shopId: id, shopName, role, barberId }; commit();
    },
    async removeMember(id, email) { delete S.docs[`${sp(id)}/members/${email}`]; delete S.docs[`userShops/${email}/shops/${id}`]; commit(); },
    newId: () => nid(),
    async getOne(id, sub, docId) { return get(`${sp(id)}/${sub}/${docId}`); },
    watch(id, sub, cb) { return live(() => cb(kids(`${sp(id)}/${sub}`))); },
    async list(id, sub) { return kids(`${sp(id)}/${sub}`); },
    async save(id, sub, docId, data) { const k = docId || nid(); apply(`${sp(id)}/${sub}/${k}`, data, !!docId); commit(); return k; },
    async upd(id, sub, docId, data) { const p = `${sp(id)}/${sub}/${docId}`; if (!S.docs[p]) throw E('not-found'); apply(p, data, true); commit(); },
    async del(id, sub, docId) { delete S.docs[`${sp(id)}/${sub}/${docId}`]; commit(); },
    async run(id, ops) {
      for (const o of ops) {
        const p = `${sp(id)}/${o.sub}/${o.id}`;
        if (o.t === 'set') apply(p, o.data, !!o.merge);
        else if (o.t === 'update') { if (S.docs[p]) apply(p, o.data, true); }
        else if (o.t === 'del') delete S.docs[p];
      }
      commit();
    },
    watchRange(id, sub, f, a, b, cb) { return live(() => cb(kids(`${sp(id)}/${sub}`).filter(d => d[f] >= a && d[f] <= b))); },
    async listRange(id, sub, f, a, b) { return kids(`${sp(id)}/${sub}`).filter(d => d[f] >= a && d[f] <= b); },
    watchEq(id, sub, f, v, cb) { return live(() => cb(kids(`${sp(id)}/${sub}`).filter(d => d[f] === v))); },
    async listEq(id, sub, f, v) { return kids(`${sp(id)}/${sub}`).filter(d => d[f] === v); },
    async locksFor(id, date) { return kids(`${sp(id)}/locks`).filter(l => l.date === date).map(l => l.id); },
    async book(id, appt, locks) {
      S = load();
      if (locks.some(l => S.docs[`${sp(id)}/locks/${l}`])) throw new Error('SLOT_TAKEN');
      const k = nid();
      apply(`${sp(id)}/appointments/${k}`, appt, false);
      locks.forEach(l => { S.docs[`${sp(id)}/locks/${l}`] = { date: appt.date, barberId: appt.barberId, apptId: k }; });
      commit(); return k;
    }
  };
}

const setApptStatus = (shopId, a, status, extra = {}) => DB.run(shopId, [
  { t: 'update', sub: 'appointments', id: a.id, data: { status, ...extra } },
  ...((status === 'cancelada') ? (a.locks || []).map(l => ({ t: 'del', sub: 'locks', id: l })) : [])
]);

/* =====================================================================
   DISPONIBILIDAD (cuadrícula de turnos + bloqueos anti doble reserva)
   ===================================================================== */
function dayHours(shop, date) { const h = (shop.hours || DEFAULT_HOURS)[String(wd(date))]; return h && !h.closed && h.open < h.close ? h : null; }
const lockId = (bid, date, t) => `${bid}_${date}_${toHM(t).replace(':', '')}`;
function locksOf(bid, date, start, duration, S) {
  const need = Math.max(1, Math.ceil(duration / S)); const t0 = toMin(start);
  return Array.from({ length: need }, (_, k) => lockId(bid, date, t0 + k * S));
}
const worksOn = (b, date) => b.active !== false && (!Array.isArray(b.days) || b.days.map(Number).includes(wd(date)));
function computeSlots(shop, barbers, duration, date, taken, barberId, notice = 0) {
  const S = +shop.slotMinutes || 30, need = Math.max(1, Math.ceil(duration / S));
  const h = dayHours(shop, date); if (!h) return [];
  const list = barbers.filter(b => (barberId === 'any' || b.id === barberId) && worksOn(b, date));
  const open = Math.ceil(toMin(h.open) / S) * S, close = toMin(h.close);
  let minT = -1;
  if (date === todayStr()) { const n = new Date(); minT = n.getHours() * 60 + n.getMinutes() + notice; }
  if (date < todayStr()) return [];
  const out = [];
  for (let t = open; t + need * S <= close; t += S) {
    if (t < minT) continue;
    const free = list.filter(b => { for (let k = 0; k < need; k++) if (taken.has(lockId(b.id, date, t + k * S))) return false; return true; });
    if (free.length) out.push({ t, barberId: free[Math.floor(Math.random() * free.length)].id });
  }
  return out;
}
async function createBooking(shop, svc, barber, date, t, client, source, addons = []) {
  const S = +shop.slotMinutes || 30;
  const duration = +svc.duration + addons.reduce((s, a) => s + (+a.duration || 0), 0);
  const price = (+svc.price || 0) + addons.reduce((s, a) => s + (+a.price || 0), 0);
  const start = toHM(t), end = toHM(t + duration);
  const appt = {
    serviceId: svc.id, serviceName: [svc.name, ...addons.map(a => a.name)].join(' + '), duration, price,
    addons: addons.map(a => ({ id: a.id, name: a.name, price: +a.price || 0, duration: +a.duration || 0 })),
    barberId: barber.id, barberName: barber.name, date, start, end,
    clientName: client.name.trim().slice(0, 70), clientPhone: client.phone.trim().slice(0, 25), note: (client.note || '').trim().slice(0, 200),
    status: 'confirmada', source, createdAt: Date.now(), locks: locksOf(barber.id, date, start, duration, S)
  };
  const id = await DB.book(shop.id, appt, appt.locks);
  return { id, ...appt };
}

function stopAdmin() {
  state.subs.forEach(u => { try { u(); } catch {} }); state.subs = [];

  state.shop = null; state.shellFor = null; state.services = []; state.barbers = []; state.products = []; state.clients = {}; state.queue = []; state.appts = [];

function route() {
  const h = location.hash || '#/';
  let m;
  const isPubHash = /^#\/(r|cita|resena|tv)\//.test(h); document.body.classList.toggle('pubmode', isPubHash);
  const pubRoute = (key, fn) => { if (state.routeKey !== key) { state.routeKey = key; stopAdmin(); stopPub(); fn(); } };
  if ((m = h.match(/^#\/r\/([a-z0-9-]+)(\/fila)?/))) return pubRoute(h, () => renderPublic(m[1], m[2] ? 'fila' : 'book'));
  if ((m = h.match(/^#\/cita\/([a-z0-9-]+)\/([\w-]+)/))) return pubRoute(h, () => renderManage(m[1], m[2]));
  if ((m = h.match(/^#\/resena\/([a-z0-9-]+)\/([\w-]+)/))) return pubRoute(h, () => renderReview(m[1], m[2]));
  if ((m = h.match(/^#\/tv\/([a-z0-9-]+)/))) return pubRoute(h, () => renderTV(m[1]));
  stopPub();
  if (!state.authReady) { $('#app').innerHTML = loadingView(); return; }
  if (!state.user) { if (state.routeKey !== 'auth') { state.routeKey = 'auth'; stopAdmin(); renderAuth('login'); } return; }
  if (!state.shops.length || h.startsWith('#/nueva')) { state.routeKey = 'onb'; stopAdmin(); renderOnboarding(); return; }
  state.routeKey = 'admin';
  openAdmin((h.match(/^#\/admin\/(\w+)/) || [])[1] || 'agenda');
}

let opening = null;
async function openAdmin(view) {
  state.view = VIEWS[view] ? view : ({ services: 'catalog', barbers: 'team' }[view] || 'agenda');
  let sid = lsGet('filo_shop');
  if (!state.shops.some(s => s.shopId === sid)) sid = state.shops[0].shopId;
  if (!state.shop || state.shop.id !== sid) {
    if (opening === sid) return;
    opening = sid; $('#app').innerHTML = loadingView();
    try { await startAdmin(sid); } finally { opening = null; }
    if (!state.shop) return;
  }
  if (state.view === 'settings' && state.role !== 'owner') state.view = 'agenda';
  if (state.shellFor === state.shop.id && $('#main')) renderMain(); else renderShell();
}

async function startAdmin(shopId) {
  stopAdmin();
  const meta = state.shops.find(s => s.shopId === shopId);
  state.role = meta?.role || 'barber';
  state.myBarberId = meta?.barberId || '';
  let shop = null;
  try { shop = await DB.getShop(shopId); } catch (e) { console.error(e); }
  if (!shop) { toast('No se pudo abrir la barbería.', 'err'); state.shops = state.shops.filter(s => s.shopId !== shopId); lsSet('filo_shop', ''); route(); return; }
  state.shop = shop; lsSet('filo_shop', shopId);
  const rer = views => { if (state.shellFor === state.shop?.id && views.includes(state.view)) renderMain(); };
  state.subs.push(DB.watchShop(shopId, s => { if (s && state.shop) { state.shop = s; const t = $('#top-shop-name'); if (t) t.textContent = s.name.trim().toLowerCase() === APP_NAME.toLowerCase() ? '' : s.name; } }));
  state.subs.push(DB.watch(shopId, 'services', a => { state.services = a.sort((x, y) => (!!x.addon - !!y.addon) || (+x.price || 0) - (+y.price || 0)); rer(['agenda', 'catalog']); }));
  state.subs.push(DB.watch(shopId, 'barbers', a => { state.barbers = a.sort(byName); rer(['agenda', 'team']); }));
  state.subs.push(DB.watch(shopId, 'products', a => { state.products = a.sort(byName); rer(['catalog']); }));
  state.subs.push(DB.watch(shopId, 'clients', a => { state.clients = Object.fromEntries(a.map(c => [c.id, c])); rer(['clients']); }));
  const today = todayStr();
  state.subs.push(DB.watchEq(shopId, 'queue', 'date', today, a => {
    a.forEach(q => { if (!state.seen.has('q' + q.id)) { state.seen.add('q' + q.id); if (q.createdAt > bootTs && q.source === 'online') notify('Nuevo en la fila', q.name); } });
    state.queue = a.sort((x, y) => x.createdAt - y.createdAt); updateQueueBadge(); rer(['fila']);
  }));
  state.subs.push(DB.watchRange(shopId, 'appointments', 'createdAt', bootTs, 9e15, a => {
    a.forEach(x => { if (!state.seen.has('a' + x.id)) { state.seen.add('a' + x.id); if (x.source === 'online' && x.kind !== 'block') notify('Nueva reserva', `${x.clientName} · ${fmtShort(x.date)} ${x.start}`); } });
  }));
  subAppts();
}
function subAppts() {
  if (state.apptSub) state.apptSub();
  state.apptSub = DB.watchRange(state.shop.id, 'appointments', 'date', state.date, state.date, a => { state.appts = a; if (state.shellFor === state.shop?.id && state.view === 'agenda') renderMain(); });
}

  const n = state.queue.filter(q => q.status === 'esperando').length;

}

function apptCard(a) {

  return `<article class="appt st-${a.status}">

    <div class="appt-body">
      <div class="appt-top"><strong>${esc(a.clientName)}</strong><span class="chip ${c}">${a.saleId ? 'Pagada' : label}</span></div>
      <div class="muted small">${esc(a.serviceName)} · ${money(a.price)}</div>
      <div class="row" style="gap:6px">${a.source === 'online' ? '<span class="chip gold">En línea</span>' : ''}${a.recurring ? '<span class="chip blue">Recurrente</span>' : ''}${a.reminded ? '<span class="chip green">Recordada</span>' : ''}${a.cancelledBy === 'cliente' ? '<span class="chip red">Canceló el cliente</span>' : ''}${stamps}</div>

function emptyState(text, act, label) { return `<div class="empty">${text}${act ? `<div style="margin-top:10px"><button class="btn sm primary" data-act="${act}">${label}</button></div>` : ''}</div>`; }
const barberOpts = (sel, withAll) => (withAll ? `<option value="all">Todos los barberos</option>` : '') + state.barbers.filter(b => b.active !== false).map(b => `<option value="${b.id}" ${b.id === sel ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
function periodRange(p) {
  const t = todayStr(), d = new Date(t + 'T12:00:00'), y = d.getFullYear(), mo = d.getMonth(), day = d.getDate();
  const ms = (yy, mm, dd) => dstr(new Date(yy, mm, dd, 12));
  const last = (yy, mm) => new Date(yy, mm + 1, 0, 12).getDate();
  if (p === 'q') return day <= 15 ? [ms(y, mo, 1), ms(y, mo, 15), 'Esta quincena', 1] : [ms(y, mo, 16), ms(y, mo, last(y, mo)), 'Esta quincena', 1];
  if (p === 'qp') return day <= 15 ? [ms(y, mo - 1, 16), ms(y, mo - 1, last(y, mo - 1)), 'Quincena pasada', 1] : [ms(y, mo, 1), ms(y, mo, 15), 'Quincena pasada', 1];
  if (p === 'm') return [ms(y, mo, 1), ms(y, mo, last(y, mo)), 'Este mes', 2];
  return [ms(y, mo - 1, 1), ms(y, mo - 1, last(y, mo - 1)), 'Mes pasado', 2];
}

      const draw = q => {
        const el = $('#cl-list'); if (!el) return;

          return `<tr><td><strong>${esc(c.name)}</strong><div class="muted small">${esc(c.phone || '—')}${c.birthday ? ` · 🎂 ${esc(c.birthday.slice(5))}` : ''}${c.noshow ? ` · <span class="chip amber">${c.noshow} sin asistir</span>` : ''}</div>${c.notes ? `<div class="small muted">📋 ${esc(c.notes)}</div>` : ''}</td>
          <td>${c.visits}</td><td>${money(c.spent)}</td>${L.on ? `<td><span class="chip ${c.stamps >= (L.every || 10) ? 'green' : 'gray'}">★ ${c.stamps}/${L.every || 10}</span></td>` : ''}
          <td>${c.last ? fmtShort(c.last) : '—'}${c.next ? `<div class="small"><span class="chip blue">Próxima: ${esc(fmtShort(c.next))}</span></div>` : away ? `<div class="small"><span class="chip amber">Hace ${days} días</span></div>` : ''}</td>

        }).join('')}</tbody></table></div>`;
      };
      draw('');
      const q = $('#cl-q'); if (q) q.oninput = e => draw(e.target.value);
    }
  },

        <div class="datebar"><select id="liq-p">${[['q', 'Esta quincena'], ['qp', 'Quincena pasada'], ['m', 'Este mes'], ['mp', 'Mes pasado']].map(([k, l]) => `<option value="${k}" ${state.liqPeriod === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>

          <div><strong>${esc(b.name)}</strong><div class="muted small">${(Array.isArray(b.days) ? b.days.map(Number).sort().map(x => DAYS_S[x]).join(' · ') : 'Todos los días')}${b.active === false ? ' · Inactivo' : ''}</div>
          <div class="muted small">${b.payMode === 'arriendo' ? `Arriendo de silla: ${money(b.rent)} / quincena` : `Comisión: ${+b.svcPct || 0}% servicios · ${+b.prodPct || 0}% productos`}</div></div></div>
        <div class="row"><button class="btn sm ghost" data-act="bar-edit" data-id="${b.id}">Editar</button><button class="btn sm danger-ghost" data-act="bar-del" data-id="${b.id}">Eliminar</button></div>
      </div>`).join('') || emptyState('Aún no tienes barberos.', 'bar-edit', 'Agregar barbero')}</div>
      <p class="muted small" style="margin-top:14px">Para que un barbero vea la agenda desde su celular, agrégalo en <a href="#/admin/settings">Ajustes → Accesos</a> con su correo.</p>`;
    },
    async after() {
      if (state.teamTab !== 'pay') return;
      $('#liq-p').onchange = e => { state.liqPeriod = e.target.value; renderMain(); };
      const [from, to, label, mult] = periodRange(state.liqPeriod);
      const sales = await DB.listRange(state.shop.id, 'sales', 'date', from, to);
      const el = $('#liq'); if (!el) return;
      let barbers = state.barbers;
      if (state.role !== 'owner' && state.myBarberId) barbers = barbers.filter(b => b.id === state.myBarberId);
      const rows = barbers.map(b => {
        const mine = sales.filter(s => s.barberId === b.id);
        const svc = mine.reduce((t, s) => t + (s.lines || []).filter(l => l.type === 'service').reduce((x, l) => x + l.price * l.qty, 0) - (+s.discount || 0), 0);
        const prod = mine.reduce((t, s) => t + (s.lines || []).filter(l => l.type === 'product').reduce((x, l) => x + l.price * l.qty, 0), 0);
        const tips = mine.reduce((t, s) => t + (+s.tip || 0), 0);
        const prodCom = Math.round(prod * (+b.prodPct || 0) / 100);
        let pay, detail;
        if (b.payMode === 'arriendo') { const rent = (+b.rent || 0) * mult; pay = svc + prodCom + tips - rent; detail = `Servicios ${money(svc)} + com. productos ${money(prodCom)} + propinas ${money(tips)} − arriendo ${money(rent)}`; }
        else { const svcCom = Math.round(svc * (+b.svcPct || 0) / 100); pay = svcCom + prodCom + tips; detail = `${+b.svcPct || 0}% de ${money(svc)} = ${money(svcCom)} + com. productos ${money(prodCom)} + propinas ${money(tips)}`; }
        return { b, n: mine.length, svc, prod, tips, pay, detail };
      });
      const shopKeeps = sales.reduce((t, s) => t + (+s.total || 0), 0) - rows.reduce((t, r) => t + r.pay, 0);
      el.innerHTML = `<p class="muted" style="margin-bottom:12px">${label}: ${fmtShort(from)} – ${fmtShort(to)}</p>
      <div class="card tablewrap" style="padding:6px 14px"><table><thead><tr><th>Barbero</th><th class="num">Ventas</th><th class="num">Servicios</th><th class="num">Productos</th><th class="num">Propinas</th><th class="num">A pagar</th><th></th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><strong>${esc(r.b.name)}</strong><div class="muted small">${esc(r.detail)}</div></td><td class="num">${r.n}</td><td class="num">${money(r.svc)}</td><td class="num">${money(r.prod)}</td><td class="num">${money(r.tips)}</td><td class="num"><b style="color:${r.pay < 0 ? 'var(--red)' : 'var(--accent2)'}">${money(r.pay)}</b>${r.pay < 0 ? '<div class="small muted">debe al local</div>' : ''}</td>
        <td class="num">${r.b.phone ? `<a class="btn sm ghost" target="_blank" rel="noopener" href="${esc(waLink(r.b.phone, `Liquidación ${label} (${fmtShort(from)} – ${fmtShort(to)}) · ${state.shop.name}\n${r.b.name}: ${r.n} ventas\n${r.detail}\nTotal: ${money(r.pay)}`, state.shop.countryCode))}">Enviar</a>` : ''}</td></tr>`).join('')}
      ${state.role === 'owner' ? `<tr class="total"><td>Queda para el local</td><td></td><td></td><td></td><td></td><td class="num">${money(shopKeeps)}</td><td></td></tr>` : ''}</tbody></table></div>
      <div class="row" style="margin-top:12px"><button class="btn sm ghost" data-act="liq-csv">Descargar CSV</button></div>`;
      VIEWS.team.csv = () => 'Barbero,Ventas,Servicios,Productos,Propinas,A pagar\n' + rows.map(r => [r.b.name, r.n, r.svc, r.prod, r.tips, r.pay].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    }
  },

  /* ---------------- REPORTES ---------------- */
  reports: {
    html() {
      return `<div class="view-head"><div><h1>Reportes</h1><p class="muted">Cómo va tu barbería.</p></div></div>
      <div class="seg">${[7, 30, 90, 365].map(n => `<button class="${n === state.rp ? 'on' : ''}" data-act="rp" data-n="${n}">${n === 365 ? '1 año' : n + ' días'}</button>`).join('')}</div>
      <div id="rp-body"><div class="loading" style="min-height:120px"><div class="spinner"></div></div></div>`;
    },
    async after() {
      const n = state.rp, to = todayStr(), from = addDays(to, -(n - 1));
      const [list0, sales, reviews] = await Promise.all([DB.listRange(state.shop.id, 'appointments', 'date', from, to), DB.listRange(state.shop.id, 'sales', 'date', from, to), DB.list(state.shop.id, 'reviews')]);
      const el = $('#rp-body'); if (!el) return;
      const list = list0.filter(a => a.kind !== 'block');
      const ok = list.filter(a => a.status !== 'cancelada');
      const noshow = list.filter(a => a.status === 'no_asistio').length;
      const canc = list.filter(a => a.status === 'cancelada').length;
      const online = ok.filter(a => a.source === 'online').length;
      const rev = sales.reduce((t, s) => t + (+s.total || 0), 0), tips = sales.reduce((t, s) => t + (+s.tip || 0), 0);
      const lines = sales.flatMap(s => (s.lines || []).map(l => ({ ...l, barberName: s.barberName, barberId: s.barberId })));
      const group = (arr, key, lbl) => { const m = {}; arr.forEach(a => { const k = a[key] || a[lbl] || '—'; m[k] = m[k] || { label: a[lbl] || '—', n: 0, v: 0 }; m[k].n += a.qty || 1; m[k].v += (a.price || 0) * (a.qty || 1); }); return Object.values(m).sort((a, b) => b.v - a.v); };
      const bars = rows => { const max = Math.max(1, ...rows.map(r => r.v)); return rows.length ? `<div class="bars">${rows.slice(0, 10).map(r => `<div class="bar"><span>${esc(r.label)}</span><div class="track"><div class="fill" style="width:${(r.v / max * 100).toFixed(1)}%"></div></div><span class="v">${money(r.v)} · ${r.n}</span></div>`).join('')}</div>` : '<p class="muted small">Sin datos en este período.</p>'; };
      const byMethod = {}; sales.forEach(s => { byMethod[s.method] = byMethod[s.method] || { label: PAY[s.method] || s.method, n: 0, v: 0 }; byMethod[s.method].n++; byMethod[s.method].v += +s.total || 0; });
      const byDay = Array(7).fill(0); ok.forEach(a => byDay[wd(a.date)]++);
      const maxD = Math.max(1, ...byDay);
      const rAll = reviews.sort((a, b) => b.createdAt - a.createdAt);
      const avg = rAll.length ? rAll.reduce((t, r) => t + r.rating, 0) / rAll.length : 0;
      const byBarberR = {}; rAll.forEach(r => { byBarberR[r.barberName] = byBarberR[r.barberName] || []; byBarberR[r.barberName].push(r.rating); });
      const clientsSet = {}; sales.forEach(s => { if (s.clientKey) clientsSet[s.clientKey] = (clientsSet[s.clientKey] || 0) + 1; });
      const cN = Object.keys(clientsSet).length, repeat = Object.values(clientsSet).filter(x => x > 1).length;
      el.innerHTML = `<div class="stats">
        <div class="stat"><b class="m">${money(rev)}</b><span>Cobrado en caja</span></div>
        <div class="stat"><b class="m">${money(sales.length ? (rev - tips) / sales.length : 0)}</b><span>Ticket promedio</span></div>
        <div class="stat"><b class="m">${money(tips)}</b><span>Propinas</span></div>
        <div class="stat"><b>${ok.length ? Math.round(online / ok.length * 100) : 0}%</b><span>Reservas en línea</span></div>
        <div class="stat"><b>${cN ? Math.round(repeat / cN * 100) : 0}%</b><span>Clientes que repiten</span></div>
        <div class="stat"><b>${noshow}</b><span>No asistieron</span></div>
        <div class="stat"><b>${canc}</b><span>Canceladas</span></div>
        <div class="stat"><b>${avg ? avg.toFixed(1) + '★' : '—'}</b><span>${rAll.length} reseñas</span></div>
      </div>
      <div class="two"><section class="card"><h2>Por servicio</h2>${bars(group(lines.filter(l => l.type === 'service'), 'name', 'name'))}</section>
      <section class="card"><h2>Por barbero</h2>${bars(group(lines.filter(l => l.type !== 'giftcard'), 'barberId', 'barberName'))}</section></div>
      <div class="two" style="margin-top:16px"><section class="card"><h2>Productos más vendidos</h2>${bars(group(lines.filter(l => l.type === 'product'), 'refId', 'name'))}</section>
      <section class="card"><h2>Métodos de pago</h2>${bars(Object.values(byMethod).sort((a, b) => b.v - a.v))}</section></div>
      <section class="card" style="margin-top:16px"><h2>Días más ocupados</h2><div class="bars">${[1, 2, 3, 4, 5, 6, 0].map(i => `<div class="bar"><span>${DAYS[i]}</span><div class="track"><div class="fill" style="width:${(byDay[i] / maxD * 100).toFixed(1)}%"></div></div><span class="v">${byDay[i]} citas</span></div>`).join('')}</div></section>
      <section class="card" style="margin-top:16px"><h2>Reseñas</h2>
        ${Object.keys(byBarberR).length ? `<div class="row" style="margin-bottom:12px">${Object.entries(byBarberR).map(([k, v]) => `<span class="chip gold">${esc(k)}: ${(v.reduce((a, b) => a + b, 0) / v.length).toFixed(1)}★ (${v.length})</span>`).join('')}</div>` : ''}
        ${rAll.slice(0, 20).map(r => `<div class="review"><div class="spread"><span><span class="stars">${stars(r.rating)}</span> <b>${esc(r.clientName)}</b> <span class="muted small">con ${esc(r.barberName)} · ${new Date(r.createdAt).toLocaleDateString('es-CO')}</span></span><button class="btn sm danger-ghost" data-act="rev-del" data-id="${r.id}">Ocultar</button></div>${r.comment ? `<p>${esc(r.comment)}</p>` : ''}</div>`).join('') || '<p class="muted small">Aún no hay reseñas. Pídelas con el botón “Pedir reseña” en las citas atendidas.</p>'}
      </section>`;
    }
  },

function estWait(shop, barbers, n) {
  const today = todayStr(), working = Math.max(1, barbers.filter(b => worksOn(b, today)).length);
  return Math.round(n * (+shop.slotMinutes || 30) / working);
}

/* ---------------- clientes: agregado de citas + fichas ---------------- */
async function buildClients() {
  const t = todayStr();
  const list = await DB.listRange(state.shop.id, 'appointments', 'date', addDays(t, -365), addDays(t, 180));
  const map = new Map();
  for (const a of list) {
    if (a.status === 'cancelada' || a.kind === 'block') continue;
    const k = clientKey(a.clientName, a.clientPhone);
    const c = map.get(k) || { key: k, name: a.clientName, phone: a.clientPhone, visits: 0, spent: 0, last: '', next: '', noshow: 0 };
    if (a.status === 'completada') { c.visits++; c.spent += +a.price || 0; if (a.date > c.last) c.last = a.date; }
    if (a.status === 'no_asistio') c.noshow++;
    if (a.status === 'confirmada' && a.date >= t && (!c.next || a.date < c.next)) c.next = a.date;
    c.name = a.clientName; if (a.clientPhone) c.phone = a.clientPhone;
    map.set(k, c);
  }
  for (const [k, d] of Object.entries(state.clients)) {
    const c = map.get(k) || { key: k, name: d.name, phone: d.phone, visits: 0, spent: 0, last: '', next: '', noshow: 0 };
    c.name = d.name || c.name; c.phone = d.phone || c.phone;
    c.visits = Math.max(c.visits, +d.visits || 0); c.spent = Math.max(c.spent, +d.spent || 0);
    if (d.lastVisit && d.lastVisit > c.last) c.last = d.lastVisit;
    c.notes = d.notes || ''; c.birthday = d.birthday || ''; c.stamps = +d.stamps || 0;
    map.set(k, c);
  }
  for (const c of map.values()) if (c.stamps === undefined) c.stamps = 0;
  return [...map.values()].sort((a, b) => (b.last || b.next || '').localeCompare(a.last || a.next || ''));
}

  const curAddons = () => $$('[data-addon]', m).filter(x => x.checked).map(x => adds.find(a => a.id === x.dataset.addon));
  const load = async () => {
    chosen = null; const box = $('#nb-slots', m); box.innerHTML = '<p class="muted small">Buscando horarios…</p>';
    const svc = svcs.find(s => s.id === $('#nb-svc', m).value), date = $('#nb-date', m).value;
    if (!date) { box.innerHTML = ''; return; }
    const dur = +svc.duration + curAddons().reduce((t, a) => t + (+a.duration || 0), 0);
    const taken = new Set(await DB.locksFor(state.shop.id, date));
    slots = computeSlots(state.shop, state.barbers, dur, date, taken, $('#nb-bar', m).value, -((+state.shop.slotMinutes || 30) - 1));
    box.innerHTML = slots.length ? slots.map((s, i) => `<button class="slot" data-i="${i}">${toHM(s.t)}</button>`).join('') : '<p class="muted small">No hay horarios libres ese día.</p>';
  };
  $('#nb-slots', m).onclick = e => { const b = e.target.closest('.slot'); if (!b) return; $$('.slot', m).forEach(x => x.classList.remove('on')); b.classList.add('on'); chosen = slots[+b.dataset.i]; };
  ['nb-svc', 'nb-bar', 'nb-date'].forEach(id => { $('#' + id, m).onchange = load; });
  $$('[data-addon]', m).forEach(x => x.onchange = load);
  load();
  $('#nb-save', m).onclick = async () => {
    const name = $('#nb-name', m).value.trim();
    if (!chosen) return toast('Elige una hora.', 'err');
    if (name.length < 2) return toast('Escribe el nombre del cliente.', 'err');
    const svc = svcs.find(s => s.id === $('#nb-svc', m).value), date = $('#nb-date', m).value, addons = curAddons();
    const barber = state.barbers.find(b => b.id === chosen.barberId);
    const rep = +$('#nb-rep', m).value, times = rep ? +$('#nb-times', m).value : 1;
    const client = { name, phone: $('#nb-phone', m).value, note: $('#nb-note', m).value };
    const btn = $('#nb-save', m); btn.disabled = true;
    try {
      const first = await createBooking(state.shop, svc, barber, date, chosen.t, client, 'local', addons);
      let made = 1; const skipped = [];
      for (let k = 1; k < times; k++) {
        const d = addDays(date, 7 * rep * k);
        const dur = first.duration, S = +state.shop.slotMinutes || 30;
        const h = dayHours(state.shop, d);
        const need = locksOf(barber.id, d, first.start, dur, S);
        const taken = new Set(await DB.locksFor(state.shop.id, d));
        if (!h || !worksOn(barber, d) || toMin(first.start) < toMin(h.open) || toMin(first.end) > toMin(h.close) || need.some(l => taken.has(l))) { skipped.push(d); continue; }
        try { await createBooking(state.shop, svc, barber, d, chosen.t, client, 'local', addons); made++; } catch { skipped.push(d); }
      }
      if (rep) { await DB.upd(state.shop.id, 'appointments', first.id, { recurring: true }).catch(() => {}); }
      closeModal();
      toast(rep ? `${made} citas creadas${skipped.length ? ` · ocupadas: ${skipped.map(fmtShort).join(', ')}` : ''}` : 'Cita creada');
      if (date !== state.date) { state.date = date; subAppts(); renderMain(); }
    } catch (err) { btn.disabled = false; if (err.message === 'SLOT_TAKEN') { toast('Ese horario acaba de ocuparse. Elige otro.', 'err'); load(); } else toast(errMsg(err), 'err'); }
  };
}

function openBlockModal() {
  const bars = state.barbers.filter(b => b.active !== false);
  if (!bars.length) return toast('Primero agrega un barbero.', 'err');
  const d = state.date < todayStr() ? todayStr() : state.date;
  const m = modal(`<h2>Bloquear horario</h2><p class="muted small">Para almuerzo, diligencias o vacaciones. Nadie podrá reservar en ese rango. Las citas ya agendadas se mantienen.</p>
    <form id="bl-f" class="form">
      <label>Barbero<select id="bl-bar"><option value="all">Todos</option>${barberOpts(state.myBarberId || (state.agBarber !== 'all' ? state.agBarber : ''), false)}</select></label>
      <div class="grid2"><label>Desde el día<input type="date" id="bl-d1" value="${d}" min="${todayStr()}" required></label><label>Hasta el día<input type="date" id="bl-d2" value="${d}" min="${todayStr()}" required></label></div>
      <label class="check"><input type="checkbox" id="bl-all"> Todo el día</label>
      <div class="grid2" id="bl-hours"><label>De<input type="time" id="bl-t1" value="13:00"></label><label>A<input type="time" id="bl-t2" value="14:00"></label></div>
      <label>Motivo<input id="bl-reason" value="Almuerzo" maxlength="40"></label>
      <div class="modal-actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="bl-btn">Bloquear</button></div>
    </form>`);
  $('#bl-all', m).onchange = e => { $('#bl-hours', m).style.display = e.target.checked ? 'none' : ''; };
  $('#bl-f', m).onsubmit = async e => {
    e.preventDefault();
    const bsel = $('#bl-bar', m).value, d1 = $('#bl-d1', m).value, d2 = $('#bl-d2', m).value, all = $('#bl-all', m).checked;
    const reason = $('#bl-reason', m).value.trim() || 'Bloqueado';
    if (d2 < d1) return toast('Revisa las fechas.', 'err');
    if (diffDays(d2, d1) > 60) return toast('Máximo 60 días por bloqueo.', 'err');
    const S = +state.shop.slotMinutes || 30, targets = bsel === 'all' ? bars : bars.filter(b => b.id === bsel);
    $('#bl-btn', m).disabled = true;
    let n = 0;
    for (let d = d1; d <= d2; d = addDays(d, 1)) {
      const h = dayHours(state.shop, d); if (!h) continue;
      const a = all ? toMin(h.open) : toMin($('#bl-t1', m).value), b = all ? toMin(h.close) : toMin($('#bl-t2', m).value);
      if (b <= a) { $('#bl-btn', m).disabled = false; return toast('La hora final debe ser mayor.', 'err'); }
      const taken = new Set(await DB.locksFor(state.shop.id, d));
      for (const bar of targets) {
        if (!worksOn(bar, d)) continue;
        const locks = []; for (let t = Math.floor(a / S) * S; t < b; t += S) { const l = lockId(bar.id, d, t); if (!taken.has(l)) locks.push(l); }
        if (!locks.length) continue;
        const appt = { kind: 'block', serviceId: '', serviceName: 'Bloqueo', duration: b - a, price: 0, barberId: bar.id, barberName: bar.name, date: d, start: toHM(a), end: toHM(b), clientName: reason, clientPhone: '', note: '', status: 'confirmada', source: 'local', createdAt: Date.now(), locks };
        try { await DB.book(state.shop.id, appt, locks); n++; } catch (err) { console.error(err); }
      }
    }
    closeModal(); toast(n ? `Horario bloqueado (${n})` : 'No había espacio libre que bloquear.');
  };
}

async function pubLoadSlots() {
  const box = $('#pub-slots'); if (!box) return;
  const date = pub.date;
  if (!date) { box.innerHTML = '<p class="muted">No hay días disponibles.</p>'; return; }
  box.innerHTML = '<div class="loading" style="min-height:80px"><div class="spinner"></div></div>';
  try {
    const taken = new Set(await DB.locksFor(pub.shop.id, date));
    if (pub.date !== date || !$('#pub-slots')) return;
    pub.slots = computeSlots(pub.shop, pub.barbers, pubSvcTotal().duration, date, taken, pub.barberId, +pub.shop.minNotice || 0);
    if (!pub.slots.length) { box.innerHTML = `<div class="empty">No quedan horarios este día.<div style="margin-top:10px"><button class="btn sm primary" data-act="p-wait">Avísame si se libera un cupo</button></div></div>`; return; }
    const groups = [['Mañana', 0, 720], ['Tarde', 720, 1080], ['Noche', 1080, 1440]];
    box.innerHTML = groups.map(([g, a, b]) => { const l = pub.slots.map((s, i) => ({ s, i })).filter(x => x.s.t >= a && x.s.t < b); return l.length ? `<div class="group-t">${g}</div><div class="slots">${l.map(x => `<button class="slot" data-act="p-slot" data-i="${x.i}">${toHM(x.s.t)}</button>`).join('')}</div>` : ''; }).join('');
  } catch (e) { console.error(e); box.innerHTML = '<p class="empty">No se pudieron cargar los horarios. Revisa tu conexión.</p>'; }
}

function pubQueue() {

  const me = pub.queue.find(q => q.id === pub.myQ);

    return `<div class="success"><p class="muted">Tu turno</p><div class="ticket">#${me.number}</div><h2 style="margin-top:8px">${pos === 0 ? '¡Eres el siguiente!' : `${pos} persona${pos === 1 ? '' : 's'} antes que tú`}</h2>
      <p class="muted">Espera aproximada: ~${estWait(s, pub.barbers, pos)} min. Esta pantalla se actualiza sola.</p></div>
      <button class="btn ghost block" data-act="p-qleave">Salir de la fila</button>`;
  }
  if (me && me.status === 'atendiendo') return `<div class="success"><div class="ticket">#${me.number}</div><h2>¡Es tu turno!</h2><p class="muted">Acércate a tu barbero.</p></div>`;

    ${serving.length ? `<p class="muted small">Atendiendo ahora: ${serving.map(q => '#' + q.number).join(', ')}</p>` : ''}

      <label>Servicio<select id="q-svc">${pub.services.map(x => `<option value="${esc(x.name)}">${esc(x.name)} · ${money(x.price)}</option>`).join('')}</select></label>
      <button class="btn primary block">Unirme a la fila</button>
    </form>`;
}
function bindQueueForm() {
  const f = $('#q-form'); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault();
    const name = $('#q-name').value.trim(); if (name.length < 2) return toast('Escribe tu nombre.', 'err');

    const bn = id => (bars.find(b => b.id === id) || {}).name || '';
    $('#app').innerHTML = `<div class="stripe"></div><div class="tv"><div><div class="spread">${shop.logo === 'brand' ? `<div class="logo-full">${LOGO_FULL}</div>` : `<h1>${esc(shop.name)}</h1>`}<span class="clock" id="tv-clock"></span></div><div id="tv-q"></div></div>
      <div style="text-align:center"><h2>Únete a la fila</h2><div id="tv-qr" class="qr"></div><p class="muted" style="font-size:20px">Escanea con tu celular<br>o reserva tu cita</p></div></div>`;
    drawQR($('#tv-qr'), queueUrl(slug), 240);
    const tick = () => { const c = $('#tv-clock'); if (c) c.textContent = nowHM(); };
    tick(); const iv = setInterval(tick, 10000); pubSubs.push(() => clearInterval(iv));
    pubSubs.push(DB.watchEq(shop.id, 'queue', 'date', todayStr(), list => {
      const el = $('#tv-q'); if (!el) return;
      list.sort((a, b) => a.createdAt - b.createdAt);
      const serving = list.filter(q => q.status === 'atendiendo'), wait = list.filter(q => q.status === 'esperando');
      el.innerHTML = `<div class="now"><h2>En atención</h2><div class="qlist">${serving.map(q => `<div class="qrow"><span class="row"><span class="qnum">#${q.number}</span>${esc(q.name)}</span><span class="muted">${esc(bn(q.barberId))}</span></div>`).join('') || '<p class="muted" style="font-size:22px">—</p>'}</div></div>
        <h2>En espera (${wait.length}) · ~${estWait(shop, bars.filter(b => b.active !== false), wait.length)} min</h2><div class="qlist">${wait.slice(0, 8).map(q => `<div class="qrow"><span class="row"><span class="qnum">#${q.number}</span>${esc(q.name)}</span></div>`).join('') || '<p class="muted" style="font-size:22px">Sin espera. ¡Pasa!</p>'}</div>`;
    }));
  } catch (e) { console.error(e); notFound(); }
}

function downloadIcs(a, shop) {
  const dt = (d, hm) => d.replace(/-/g, '') + 'T' + hm.replace(':', '') + '00';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Filo//Reservas//ES', 'BEGIN:VEVENT', `UID:${a.id || Date.now()}@filo`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
    `DTSTART:${dt(a.date, a.start)}`, `DTEND:${dt(a.date, a.end)}`, `SUMMARY:${a.serviceName} - ${shop.name}`, `LOCATION:${(shop.address || '').replace(/[,;]/g, ' ')}`, `DESCRIPTION:Con ${a.barberName}. Gestiona tu cita: ${manageUrl(shop.slug, a.id)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT1H', 'ACTION:DISPLAY', 'DESCRIPTION:Recordatorio de cita', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  downloadFile('cita.ics', ics, 'text/calendar');
}

/* ---------------- campañas ---------------- */
async function openCampaign() {
  const all = await buildClients(), t = todayStr(), L = state.shop.loyalty || {}, month = t.slice(5, 7);
  const segs = {
    all: ['Todos los clientes', c => true, `Hola {nombre}, te saludamos de ${state.shop.name}. Reserva tu próximo corte aquí: {enlace}`],
    d30: ['Sin venir hace +30 días', c => c.last && diffDays(t, c.last) > 30 && !c.next, `Hola {nombre}, ¡te extrañamos en ${state.shop.name}! Ya va siendo hora de un corte. Reserva aquí: {enlace}`],
    d60: ['Sin venir hace +60 días', c => c.last && diffDays(t, c.last) > 60 && !c.next, `Hola {nombre}, hace rato no te vemos por ${state.shop.name}. Esta semana tienes 10% de descuento si reservas aquí: {enlace}`],
    bday: ['Cumplen años este mes', c => c.birthday && c.birthday.slice(5, 7) === month, `¡Feliz cumpleaños, {nombre}! 🎂 En ${state.shop.name} te regalamos un descuento especial este mes. Reserva aquí: {enlace}`],
    reward: ['Con recompensa disponible', c => L.on && c.stamps >= (L.every || 10), `¡{nombre}, ya completaste ${L.every || 10} visitas! Tu próxima visita tiene: ${L.reward || 'recompensa'}. Reserva aquí: {enlace}`]
  };
  let seg = 'd30';
  const m = modal(`<h2>Campaña por WhatsApp</h2><p class="muted small">Elige a quién escribir y envía uno por uno (gratis, desde tu WhatsApp).</p>
    <label>Segmento<select id="cp-seg">${Object.entries(segs).map(([k, v]) => `<option value="${k}" ${k === seg ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></label>
    <label>Mensaje <span class="muted small">({nombre} y {enlace} se reemplazan solos)</span><textarea id="cp-msg"></textarea></label>
    <div id="cp-list"></div><div class="modal-actions"><button class="btn ghost" data-close>Cerrar</button></div>`);
  const draw = () => {
    const rows = all.filter(c => c.phone && segs[seg][1](c));
    const tpl = $('#cp-msg', m).value;
    $('#cp-list', m).innerHTML = `<p class="field-label">${rows.length} cliente${rows.length === 1 ? '' : 's'}</p>` + (rows.map(c => `<div class="mini-row"><span>${esc(c.name)} <span class="muted small">${esc(c.phone)}</span></span><a class="btn sm primary" target="_blank" rel="noopener" data-sent href="${esc(waLink(c.phone, tpl.replace(/\{nombre\}/g, firstName(c.name)).replace(/\{enlace\}/g, bookingUrl(state.shop.slug)), state.shop.countryCode))}">Enviar</a></div>`).join('') || '<p class="empty">Nadie en este segmento.</p>');
  };
  $('#cp-seg', m).onchange = e => { seg = e.target.value; $('#cp-msg', m).value = segs[seg][2]; draw(); };
  $('#cp-msg', m).value = segs[seg][2]; $('#cp-msg', m).oninput = draw;
  $('#cp-list', m).addEventListener('click', e => { const a = e.target.closest('[data-sent]'); if (a) setTimeout(() => { a.classList.remove('primary'); a.textContent = 'Enviado ✓'; }, 300); });
  draw();
}

  'prod-stock': el => openStockModal(el.dataset.id),

  'close-redo': async () => { if (confirm('¿Borrar el cierre y hacerlo de nuevo?')) { await DB.del(state.shop.id, 'cashClose', state.cajaDate); renderMain(); } },
  'void-sale': async el => {
    const s = (VIEWS.caja.sales || []).find(x => x.id === el.dataset.id); if (!s || !confirm(`¿Anular la venta de ${money(s.total)}? Se devuelve el stock y la cita vuelve a pendiente.`)) return;
    const ops = [{ t: 'del', sub: 'sales', id: s.id }];
    (s.lines || []).filter(l => l.type === 'product' && l.refId).forEach(l => ops.push({ t: 'update', sub: 'products', id: l.refId, data: { stock: INC(l.qty) } }));
    (s.lines || []).filter(l => l.type === 'giftcard' && l.refId).forEach(l => ops.push({ t: 'del', sub: 'giftcards', id: l.refId }));
    if (s.giftcode) ops.push({ t: 'update', sub: 'giftcards', id: s.giftcode, data: { balance: INC(s.total) } });
    if (s.apptId) ops.push({ t: 'update', sub: 'appointments', id: s.apptId, data: { status: 'confirmada', saleId: '', paid: false } });
    await DB.run(state.shop.id, ops); toast('Venta anulada'); renderMain();
  },
  'q-add': () => {
    const m = modal(`<h2>Agregar a la fila</h2><form id="qa-f" class="form"><label>Nombre<input id="qa-name" required maxlength="40" list="cl-dl" autocomplete="off"></label>${clientDatalist()}
      <label>Servicio<select id="qa-svc">${state.services.filter(s => !s.addon && s.active !== false).map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select></label>
      <div class="modal-actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Agregar</button></div></form>`);
    $('#qa-f', m).onsubmit = async e => { e.preventDefault(); const number = Math.max(0, ...state.queue.map(q => +q.number || 0)) + 1;
      await DB.save(state.shop.id, 'queue', null, { date: todayStr(), name: $('#qa-name', m).value.trim().slice(0, 40), serviceName: $('#qa-svc', m).value, status: 'esperando', createdAt: Date.now(), source: 'local', number, barberId: '' }); closeModal(); toast(`Turno #${number}`); };

    const m = modal(`<h2>¿Quién atiende a ${esc(q.name)}?</h2>${(bars.length ? bars : state.barbers).map(b => `<button class="opt" data-bid="${b.id}"><span class="row" style="gap:12px"><span class="avatar" style="background:${esc(b.color || COLORS[0])}">${esc(initials(b.name))}</span><strong>${esc(b.name)}</strong></span></button>`).join('')}<div class="modal-actions"><button class="btn ghost" data-close>Cancelar</button></div>`);

  'dl-qr': () => { const c = $('#qr canvas'), i = $('#qr img'); const src = c ? c.toDataURL('image/png') : i?.src; if (!src) return toast('QR no disponible sin internet.', 'err'); const l = document.createElement('a'); l.href = src; l.download = `qr-${state.shop.slug}.png`; l.click(); },

function pubAfterExtras() { if (pub.barbers.length === 1) { pub.barberId = pub.barbers[0].id; pub.step = 3; } else pub.step = 2; }
document.addEventListener('click', async e => {
  if (e.target.closest('[data-close]')) { e.preventDefault(); closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  const isLink = el.tagName === 'A' && el.getAttribute('href');
  if (!isLink && el.tagName !== 'IMG') e.preventDefault();
  try { await fn(el, e); } catch (err) { console.error(err); toast(errMsg(err), 'err'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const lb = $('.lightbox'); if (lb) lb.remove(); else if ($('#modal-root').innerHTML) closeModal(); } });

/* ---------------- PWA: instalable en el celular ---------------- */
function installManifest() {
  try {
    const icon = ICON_URL; const f = document.getElementById('fav'); if (f) f.href = icon;
    const al = document.createElement('link'); al.rel = 'apple-touch-icon'; al.href = icon; document.head.appendChild(al);
    const man = { name: APP_NAME, short_name: APP_NAME, start_url: baseUrl(), scope: baseUrl(), display: 'standalone', background_color: '#0b0b0b', theme_color: '#0b0b0b', icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml' }] };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(l);
  } catch {}
}

/* ---------------- ARRANQUE ---------------- */
async function boot() {
  $('#app').innerHTML = loadingView();
  installManifest();
  try { DB = FIREBASE_CONFIG.apiKey ? await firebaseAdapter(FIREBASE_CONFIG) : demoAdapter(); }
  catch (e) { console.error(e); $('#app').innerHTML = `<div class="stripe"></div><div class="center-wrap"><div class="card narrow"><h1>Sin conexión</h1><p class="muted">No se pudo conectar con el servidor. Revisa tu internet o la configuración de Firebase y recarga la página.</p></div></div>`; return; }
  window.addEventListener('hashchange', route);
  DB.onAuth(async u => {
    const prev = state.user?.email;
    state.user = u; state.authReady = true;
    if (u) { try { state.shops = await DB.myShops(u.email); } catch (e) { console.error(e); state.shops = []; } }
    else state.shops = [];
    const isPub = /^#\/(r|cita|resena|tv)\//.test(location.hash);
    if ((u?.email) !== prev && !isPub) { state.routeKey = ''; stopAdmin(); }
    if (!isPub) route();
  });
  route();
}
boot();
